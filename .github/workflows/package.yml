name: Build and check Python distributions

on:
  push:
    paths:
      - "pylib/**"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "pylib/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ARCHFLAGS: "-arch arm64"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Build wheel from source distribution
        working-directory: pylib
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/slac-dist"
      - name: Check archive contents and license texts
        working-directory: pylib
        run: python tests/check_distribution.py --dist "$RUNNER_TEMP/slac-dist"
      - name: Install and import outside the source tree
        run: |
          python -m pip install "$RUNNER_TEMP"/slac-dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import mymodule
          from slac_resources import library_path

          assert hasattr(mymodule, "Attacker")
          library = Path(library_path())
          assert library.is_file() and library.read_bytes().startswith(b"MTLB")
          dependencies = subprocess.check_output(["otool", "-L", mymodule.__file__], text=True)
          assert subprocess.check_output(["lipo", "-archs", mymodule.__file__], text=True).strip() == "arm64"
          assert "/opt/homebrew" not in dependencies and "libomp" not in dependencies, dependencies
          print("Native import, installed Metal resource, and dynamic dependencies verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mymodule-${{ matrix.python-version }}-arm64
          path: ${{ runner.temp }}/slac-dist/*
          if-no-files-found: error
