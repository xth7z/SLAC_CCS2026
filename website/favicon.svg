<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>SLAC shared-cache mark</title>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" stroke="#171a1f" stroke-width="4"/>

  <!-- CPU and GPU signals meet at the shared cache. -->
  <circle cx="12" cy="20" r="5" fill="#e66f25"/>
  <path d="M17 20h8" fill="none" stroke="#e66f25" stroke-width="4" stroke-linecap="round"/>
  <circle cx="52" cy="44" r="5" fill="#287a4c"/>
  <path d="M39 44h8" fill="none" stroke="#287a4c" stroke-width="4" stroke-linecap="round"/>

  <!-- Four cache sets form the central SLC. -->
  <rect x="23" y="10" width="18" height="44" rx="5" fill="#171a1f"/>
  <rect x="27" y="15" width="10" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="27" y="24" width="10" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="27" y="35" width="10" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="27" y="44" width="10" height="5" rx="1.5" fill="#ffffff"/>
</svg>
